name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: reuse the pinned compiler if it has been fetched before
        uses: actions/cache@v4
        with:
          path: tools/toolchain/.compactc
          key: compactc-${{ runner.os }}-${{ hashFiles('tools/toolchain/src/toolchain.ts') }}
      - run: npm ci
      # Exactly what a contributor runs: check the formatting, compile the
      # contract, build the library, check every cited path, typecheck, lint,
      # and test.
      - run: npm run verify

  # EVERY CONTRACT, COMPILED WITH ITS PROVING AND VERIFIER KEYS. The build
  # above compiles the converter without keys, which is all its tests need;
  # this compiles every contract the way a deployment and the local chain
  # tests need them, and keeps the manifests, so a build on another machine is
  # compared with this one by comparing the files. The local chain tests are
  # typechecked and linted against those builds here, so a change to a
  # circuit that breaks them fails its own pull request.
  keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: reuse the pinned compiler if it has been fetched before
        uses: actions/cache@v4
        with:
          path: tools/toolchain/.compactc
          key: compactc-${{ runner.os }}-${{ hashFiles('tools/toolchain/src/toolchain.ts') }}
      - run: npm ci
      - run: npm run check:local-chain
      - uses: actions/upload-artifact@v4
        with:
          name: build-manifests
          path: contracts/*/managed-keys/*.manifest.json

  # THE CONTRACTS ON A REAL CHAIN. Docker on the runner starts the pinned node,
  # indexer and proof server, and every transaction is proved and finalized.
  # It takes many minutes, so it runs when asked and after a merge to main,
  # and never as a check a pull request waits on.
  local-chain:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: reuse the pinned compiler if it has been fetched before
        uses: actions/cache@v4
        with:
          path: tools/toolchain/.compactc
          key: compactc-${{ runner.os }}-${{ hashFiles('tools/toolchain/src/toolchain.ts') }}
      - run: npm ci
      # Compiles every contract with keys, checks the tests against those
      # builds, then deploys and calls them.
      - run: npm run test:local-chain

  # STATIC ANALYSIS BY SOMETHING THAT IS NOT US. The type checker is strict and
  # the tests fail when the code is broken on purpose, and both only ever ask
  # the questions the people here thought to ask. This asks a different set,
  # written by people who have seen what goes wrong in code they did not write.
  #
  # It reads the TypeScript around the contract: the client, the checks and the
  # tests. A result whose rule has a security severity of 7.0 or more, which is
  # high or critical, fails the job; so does a result whose rule cannot be read,
  # and a results file with nothing in it. Quality results are reported only.
  analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
      - name: fail on any high or critical security result
        run: |
          for file in codeql-results/*.sarif; do
            if [ ! -s "$file" ] || ! jq -e '(.runs | length) > 0' "$file" > /dev/null; then
              echo "$file holds no analysis run, so nothing was checked; run the analysis again" >&2
              exit 1
            fi
          done
          found="$(jq -r '
            [.runs[]
             | [.tool.driver.rules[]?, .tool.extensions[]?.rules[]?] as $rules
             | ($rules | map(.id)) as $known
             | ($rules
                | map(select((.properties["security-severity"] // "0" | tonumber) >= 7) | .id)) as $high
             | .results[]
             | (.ruleId // .rule.id) as $id
             | select(($high | index($id) != null) or ($known | index($id) == null))
             | "\($id) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"]
            | .[]' codeql-results/*.sarif)"
          if [ -n "$found" ]; then
            echo "static analysis found high or critical security results. Fix the code at each place below;" >&2
            echo "a result that is wrong is cleared by excluding its query, with the reason, in a CodeQL config:" >&2
            echo "$found" >&2
            exit 1
          fi

  # WHAT A DEPENDENCY BRINGS WITH IT, READ BEFORE IT IS MERGED RATHER THAN AFTER.
  # The packages installed here are few and that is deliberate; the point of
  # this job is the next one, added in some later change by somebody who did not
  # weigh what it pulls in. A contract repository that takes an unvetted
  # dependency has widened its trust boundary without saying so.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
