name: check

# One job per check, so a pull request shows which check failed without anybody
# opening a log, and each can be required on its own. Every step of
# `npm run verify`, the one command a contributor runs, is run by a job here or
# by the shared setup, and test/checks.test.ts refuses one that is not; keys,
# local-chain and analyse run on top of those.

on:
  push:
    branches: [main]
  pull_request:
  # Starts every check by hand from the Actions page, for a commit whose run
  # never started.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # A second push to a branch under review stops the first run, which nobody is
  # reading any more. A run on main is never stopped: a commit there would be
  # left for good with no completed check against it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit rather than a tag, because a tag can be
# moved. Every checkout leaves no token in the working copy: nothing here
# pushes, so a token there would serve only code a pull request brought in.
# Every job has a time limit, so a step that hangs stops instead of running for
# hours.

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          compile: 'false'
      - run: npm run format:check

  # The contract, compiled by the pinned compiler, and the client library
  # built from it.
  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint

  # Every path a file in this repository cites is in it.
  cited-paths:
    name: cited paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          compile: 'false'
      - run: npm run self-contained

  # The runner itself rather than `npm test`, which compiles first: the setup
  # above has already compiled.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npx vitest run

  # EVERY CONTRACT, COMPILED WITH ITS PROVING AND VERIFIER KEYS. The shared
  # setup compiles the converter without keys, which is all its tests need; this
  # compiles every contract the way a deployment and the local chain tests need
  # them, and keeps the manifests, so a build on another machine is compared
  # with this one by comparing the files. The local chain tests are typechecked
  # and linted against those builds here, so a change to a circuit that breaks
  # them fails its own pull request.
  keys:
    name: keys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          compile: 'false'
      - run: npm run check:local-chain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-manifests
          path: contracts/*/managed-keys/*.manifest.json
  # THE CONTRACTS ON A REAL CHAIN. Docker on the runner starts the pinned node,
  # indexer and proof server, and every transaction is proved and finalized.
  # It takes many minutes, and it runs on every pull request: a change that
  # breaks the contracts on a chain is refused before it reaches main, not
  # found after.
  local-chain:
    name: local-chain
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          compile: 'false'
      - run: npm run test:local-chain

  # STATIC ANALYSIS BY SOMETHING THAT IS NOT US. The type checker is strict and
  # the tests fail when the code is broken on purpose, and both only ever ask
  # the questions the people here thought to ask. This asks a different set,
  # written by people who have seen what goes wrong in code they did not write.
  #
  # It reads the TypeScript around the contract: the client, the checks and the
  # tests. A result whose rule has a security severity of 7.0 or more, which is
  # high or critical, fails the job; so does a result whose rule cannot be read,
  # and a results file with nothing in it. Quality results are reported only.
  analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          output: codeql-results
      - name: fail on any high or critical security result
        run: |
          for file in codeql-results/*.sarif; do
            if [ ! -s "$file" ] || ! jq -e '(.runs | length) > 0' "$file" > /dev/null; then
              echo "$file holds no analysis run, so nothing was checked; run the analysis again" >&2
              exit 1
            fi
          done
          found="$(jq -r '
            [.runs[]
             | [.tool.driver.rules[]?, .tool.extensions[]?.rules[]?] as $rules
             | ($rules | map(.id)) as $known
             | ($rules
                | map(select((.properties["security-severity"] // "0" | tonumber) >= 7) | .id)) as $high
             | .results[]
             | (.ruleId // .rule.id) as $id
             | select(($high | index($id) != null) or ($known | index($id) == null))
             | "\($id) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"]
            | .[]' codeql-results/*.sarif)"
          if [ -n "$found" ]; then
            echo "static analysis found high or critical security results. Fix the code at each place below;" >&2
            echo "a result that is wrong is cleared by excluding its query, with the reason, in a CodeQL config:" >&2
            echo "$found" >&2
            exit 1
          fi
