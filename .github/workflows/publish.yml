name: publish

# Publishes the client library to npm when a version tag is pushed, with a
# provenance statement that ties the published package to this repository and
# to the commit it was built from.
#
# No npm token is stored anywhere. npm accepts the publish because the package
# names this repository and this workflow as its trusted publisher, and checks
# the short-lived identity GitHub issues to the publishing job. npm can only
# trust a publisher for a package that already exists on the registry, so the
# first version is published once by other means and every later one here.
#
# While packages/library/package.json marks the package private, npm refuses
# to publish it and the last step fails. That is deliberate: nothing is
# published until the package has its name.
#
# Two jobs, so the identity that can publish never shares a machine with the
# installs, the compiler download and the tests: the first builds and checks
# with read access only and hands over one packed file; the second holds the
# identity, runs no package's install scripts, and publishes that file.
# Every action is pinned to a commit rather than a tag, because a tag can be
# moved and this workflow can publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      node: ${{ steps.node.outputs.version }}
    steps:
      # The whole history, so the tagged commit can be found on main, and no
      # token left in the working copy for the installs and the tests below to
      # find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # At the Node version in .nvmrc.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # The publishing job has no checkout, so it is handed the same version.
      - name: read the pinned Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      # A tag that names another version would publish one version under the
      # name of another, and a published version cannot be replaced.
      - name: refuse a tag that is not the version the library carries
        run: |
          VERSION="v$(node -p "require('./packages/library/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "the tag is $GITHUB_REF_NAME and packages/library/package.json says $VERSION; tag the version it carries" >&2
            exit 1
          fi
      # Work reaches main only through a pull request, where the static
      # analysis and the dependency review ran. A tag on any other commit
      # would publish work nobody reviewed.
      - name: refuse a tag on a commit that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the tag $GITHUB_REF_NAME is on a commit that is not on main; tag a commit on main" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run verify
      - run: npm pack --workspace packages/library
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
      # Trusted publishing needs npm 11.5.1 or later, which Node 22 does not
      # ship, so one exact npm is installed here and nowhere else.
      - name: install the npm that publishes without a stored token
        run: npm install --global --ignore-scripts npm@11.21.3
      - name: publish the file the checks ran on
        run: npm publish ./*.tgz --provenance --access public --ignore-scripts
