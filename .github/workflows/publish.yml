name: publish

# Publishes the client library to npm when a version tag is pushed, with a
# provenance statement that ties the published package to this repository and
# to the commit it was built from.
#
# No npm token is stored anywhere. npm accepts the publish because the package
# names this repository and this workflow as its trusted publisher, and checks
# the short-lived identity GitHub issues to the publishing job. npm can only
# trust a publisher for a package that already exists on the registry, so the
# first version is published once by other means and every later one here.
#
# While package.json marks the package private, npm refuses to publish it and
# the last step fails. That is deliberate: nothing is published until the
# package has its name.
#
# Two jobs, so the identity that can publish never shares a machine with the
# installs, the compiler download and the tests: the first builds and checks
# with read access only and hands over one packed file; the second holds the
# identity, runs no package's install scripts, and publishes that file.
# Every action is pinned to a commit rather than a tag, because a tag can be
# moved and this workflow can publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0, with the whole history so the tagged commit can
      # be found on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # A tag that names another version would publish one version under the
      # name of another, and a published version cannot be replaced.
      - name: refuse a tag that is not the version package.json carries
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "the tag is $GITHUB_REF_NAME and package.json says $VERSION; tag the version package.json carries" >&2
            exit 1
          fi
      # Work reaches main only through a pull request, where the title, the
      # static analysis and the dependency review ran. A tag on any other
      # commit would publish work nobody reviewed.
      - name: refuse a tag on a commit that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the tag $GITHUB_REF_NAME is on a commit that is not on main; tag a commit on main" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run verify
      - name: read what is tracked
        run: git ls-files > "$RUNNER_TEMP/tracked"
      - run: npx tsx scripts/check-publishable.ts --tracked "$RUNNER_TEMP/tracked"
      - run: npm pack
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package
      # Trusted publishing needs npm 11.5.1 or later, which Node 22 does not
      # ship, so one exact npm is installed here and nowhere else.
      - name: install the npm that publishes without a stored token
        run: npm install --global --ignore-scripts npm@11.21.3
      - name: publish the file the checks ran on
        run: npm publish ./*.tgz --provenance --access public --ignore-scripts
