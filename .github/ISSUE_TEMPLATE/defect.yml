name: Something is wrong
description: Behaviour that does not match what this repository says it does.
labels: [defect]
body:
  - type: markdown
    attributes:
      value: >-
        **If this could lose somebody money, stop and report it privately
        instead:** the Security tab, Report a vulnerability. The contract cannot
        be changed once deployed, and a public issue is the disclosure.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, and what happened instead of what you expected.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What said it would happen
      description: >-
        The file that made you expect otherwise, and the line if you have it: a
        README claim, a comment, a test name. A document that is wrong is a
        defect on its own.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to get there from a clean clone
      description: Commands, in order, starting from `npm ci`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: What you are running it on
      description: >-
        `node --version` and your operating system. The Node version this
        repository pins is in .nvmrc, and the compiler version in
        tools/toolchain/src/toolchain.ts.
      render: shell
    validations:
      required: true
